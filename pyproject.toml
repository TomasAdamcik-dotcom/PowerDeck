[project]
name = "powerdeck"
version = "1.1.0"
description = "PowerDeck — Linux workstation profiles"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Tomas Adamcik" }]

[project.scripts]
powerdeck = "powerdeck.cli:main"
powerdeck-gtk = "powerdeck.gtk_app:main"

[tool.setuptools]
packages = ["powerdeck"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
